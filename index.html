
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Aphelele Marwarwa - Cybersecurity enthusiast and software developer. Explore my portfolio, projects, skills and experience.">
  <meta name="keywords" content="Aphelele Marwarwa, Cybersecurity, Software Developer, Web Development, Programming, Portfolio">
  <meta name="author" content="Aphelele Marwarwa">
  <meta name="theme-color" content="#080d19">

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="Aphelele Marwarwa | Cybersecurity & Software Developer">
  <meta property="og:description" content="Explore my professional portfolio, software development projects and technical skills.">
  <meta property="og:type" content="website">
  <!-- Replace this with your actual portfolio URL -->
  <meta property="og:url" content="https://yourportfolio.com">
  <meta property="og:image" content="./assets/images/social-preview.jpg">

  <title>Aphelele Marwarwa | Cybersecurity & Software Developer</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/images/Aphelele Marwarwa.png">

  <!-- Preload profile image -->
  <link rel="preload" as="image" href="./assets/images/Professional Studio Headshot.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- AOS Animation Library -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #3498db;
      --secondary-color: #9b59b6;
      --accent-color: #e74c3c;
      --highlight-color: #f1c40f;

      --text-color: #ffffff;
      --muted-text: rgba(255, 255, 255, 0.78);

      --dark-bg: rgba(7, 12, 23, 0.82);
      --light-bg: rgba(255, 255, 255, 0.1);

      --transition: 0.3s ease;
      --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    /* Reset */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      isolation: isolate;

      padding: 40px 20px;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.72),
          rgba(0, 0, 0, 0.82)
        ),
        url("./assets/images/pexels-cody-berg-463684.jpg")
        no-repeat center center / cover;

      background-attachment: fixed;

      font-family: "Poppins", sans-serif;
      color: var(--text-color);
      text-align: center;
      line-height: 1.6;

      overflow-x: hidden;
    }

    /* Particles background */
    #particles-js {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: auto;
    }

    #particles-js canvas {
      display: block;
      position: absolute;
      inset: 0;
    }

    /* Main glass card */
    .overlay {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 620px;

      padding: 45px 40px;

      background: var(--dark-bg);

      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      box-shadow: var(--card-shadow);

      animation: cardEntrance 0.8s ease both;

      transition:
        box-shadow var(--transition),
        border-color var(--transition);
    }

    .overlay:hover {
      border-color: rgba(52, 152, 219, 0.4);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
    }

    /* Profile */
    .profile-container {
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
    }

    .profile-pic {
      width: 185px;
      height: 185px;

      padding: 5px;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        var(--primary-color),
        var(--secondary-color),
        var(--accent-color),
        var(--highlight-color)
      );

      background-size: 300% 300%;
      animation: gradientBorder 8s ease infinite;

      box-shadow: 0 0 30px rgba(52, 152, 219, 0.25);

      transition: transform var(--transition), box-shadow var(--transition);
    }

    .profile-pic:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 0 35px rgba(52, 152, 219, 0.5);
    }

    .profile-pic img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
      object-position: center;

      border-radius: 50%;
      border: 4px solid #101827;
    }

    /* Introduction */
    .intro-text {
      min-height: 105px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(1.45rem, 4vw, 2rem);
      font-weight: 600;
      line-height: 1.45;

      margin: 15px 0;

      color: var(--text-color);

      text-shadow: 1px 2px 8px rgba(0, 0, 0, 0.8);
    }

    .intro-text strong {
      color: var(--primary-color);
    }

    .typed-cursor {
      color: var(--highlight-color);
      font-weight: 300;
    }

    /* Supporting text */
    .subtitle {
      max-width: 440px;
      margin: 0 auto 20px;

      color: var(--muted-text);

      font-size: 0.95rem;
      font-weight: 300;
      line-height: 1.8;
    }

    /* Social media */
    .social-links {
      display: flex;
      justify-content: center;
      align-items: center;

      gap: 22px;
      margin: 25px 0 30px;
    }

    .social-link {
      width: 46px;
      height: 46px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: var(--text-color);
      font-size: 1.35rem;

      text-decoration: none;

      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;

      transition:
        color var(--transition),
        background var(--transition),
        transform var(--transition),
        border-color var(--transition);
    }

    .social-link:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.14);
    }

    .social-link:nth-child(1):hover {
      color: #0a66c2;
      border-color: #0a66c2;
    }

    .social-link:nth-child(2):hover {
      color: #ffffff;
      border-color: #ffffff;
    }

    .social-link:nth-child(3):hover {
      color: #25d366;
      border-color: #25d366;
    }

    .social-link:nth-child(4):hover {
      color: var(--accent-color);
      border-color: var(--accent-color);
    }

    /* Buttons */
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;

      flex-wrap: wrap;
      gap: 15px;

      margin-top: 10px;
    }

    .btn {
      min-width: 190px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      padding: 13px 23px;

      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;

      color: var(--text-color);
      text-decoration: none;

      border: 2px solid var(--primary-color);
      border-radius: 50px;

      position: relative;
      overflow: hidden;
      isolation: isolate;

      transition:
        background var(--transition),
        border-color var(--transition),
        box-shadow var(--transition),
        transform var(--transition);
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      background: rgba(52, 152, 219, 0.2);
      box-shadow: 0 0 15px rgba(52, 152, 219, 0.2);
    }

    .btn-primary:hover {
      background: rgba(52, 152, 219, 0.4);
      box-shadow: 0 0 25px rgba(52, 152, 219, 0.45);
    }

    .btn-secondary {
      border-color: var(--secondary-color);
      background: rgba(155, 89, 182, 0.2);
      box-shadow: 0 0 15px rgba(155, 89, 182, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(155, 89, 182, 0.4);
      box-shadow: 0 0 25px rgba(155, 89, 182, 0.45);
    }

    /* Keyboard accessibility */
    a:focus-visible {
      outline: 3px solid var(--highlight-color);
      outline-offset: 5px;
    }

    /* Footer */
    .footer-text {
      margin-top: 30px;

      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.55);
    }

    /* Animations */
    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes gradientBorder {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Tablet */
    @media (max-width: 768px) {
      body {
        padding: 30px 16px;
        background-attachment: scroll;
      }

      .overlay {
        max-width: 540px;
        padding: 35px 25px;
      }

      .profile-pic {
        width: 160px;
        height: 160px;
      }

      .intro-text {
        min-height: 95px;
      }

      .btn-container {
        gap: 12px;
      }

      .btn {
        min-width: 180px;
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
      }

      .overlay {
        width: 100%;
        padding: 30px 18px;
        border-radius: 20px;
      }

      .profile-pic {
        width: 140px;
        height: 140px;
      }

      .intro-text {
        min-height: 90px;
        font-size: 1.35rem;
      }

      .subtitle {
        font-size: 0.85rem;
      }

      .social-links {
        gap: 15px;
        margin: 22px 0 25px;
      }

      .social-link {
        width: 42px;
        height: 42px;
        font-size: 1.2rem;
      }

      .btn-container {
        flex-direction: column;
        width: 100%;
      }

      .btn {
        width: 100%;
        max-width: 280px;
      }

      .footer-text {
        font-size: 0.7rem;
      }
    }

    /* Short landscape screens */
    @media (max-height: 650px) and (min-width: 769px) {
      body {
        align-items: flex-start;
      }

      .overlay {
        margin: 15px auto;
        padding: 25px 35px;
      }

      .profile-pic {
        width: 125px;
        height: 125px;
      }

      .intro-text {
        min-height: 70px;
        margin: 8px 0;
      }

      .social-links {
        margin: 15px 0;
      }

      .footer-text {
        margin-top: 18px;
      }
    }

    /* Reduced motion accessibility */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- Animated background -->
  <div id="particles-js" aria-hidden="true"></div>

  <main class="overlay" data-aos="zoom-in" data-aos-duration="800">

    <!-- Profile image -->
    <div class="profile-container">
      <div class="profile-pic">
        <img
          src="./assets/images/Professional Studio Headshot.png"
          alt="Professional portrait of Aphelele Marwarwa"
          width="185"
          height="185"
          fetchpriority="high"
        >
      </div>
    </div>

    <!-- Introduction -->
    <h1 id="intro-text" class="intro-text">
      Hi, I'm <strong>Aphelele Marwarwa</strong>
    </h1>

    <p class="subtitle">
      Cybersecurity enthusiast and software developer passionate about
      building innovative solutions, solving problems and creating
      meaningful digital experiences.
    </p>

    <!-- Social links -->
    <nav class="social-links" aria-label="Social media links">

      <a
        href="https://www.linkedin.com/in/aphelele-marwarwa"
        class="social-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit my LinkedIn profile"
        title="LinkedIn"
      >
        <i class="fab fa-linkedin-in" aria-hidden="true"></i>
      </a>

      <a
        href="https://github.com/Aphelele-Marwarwa"
        class="social-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit my GitHub profile"
        title="GitHub"
      >
        <i class="fab fa-github" aria-hidden="true"></i>
      </a>

      <a
        href="https://wa.me/27825918034"
        class="social-link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Contact me on WhatsApp"
        title="WhatsApp"
      >
        <i class="fab fa-whatsapp" aria-hidden="true"></i>
      </a>

      <a
        href="mailto:marwarwa.ap@gmail.com"
        class="social-link"
        aria-label="Send me an email"
        title="Email"
      >
        <i class="fas fa-envelope" aria-hidden="true"></i>
      </a>

    </nav>

    <!-- Main actions -->
    <div class="btn-container">

      <a href="./homepage.html" class="btn btn-primary">
        <i class="fas fa-briefcase" aria-hidden="true"></i>
        View Portfolio
      </a>

     <!-- <a
        href="./assets/images/Aphelele-Marwarwa-Curriculam-Vitae.pdf"
        class="btn btn-secondary"
        download
      >
        <i class="fas fa-download" aria-hidden="true"></i>
        Download CV
      </a>-->

    </div>

    <p class="footer-text">
      &copy; <span id="current-year"></span> Aphelele Marwarwa.
      All rights reserved.
    </p>

  </main>

  <!-- External JavaScript libraries -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      // Automatically update copyright year
      const yearElement = document.getElementById("current-year");

      if (yearElement) {
        yearElement.textContent = new Date().getFullYear();
      }

      // Initialize AOS if the library is available
      if (typeof AOS !== "undefined") {
        AOS.init({
          once: true,
          duration: 800,
          offset: 50,
          disable: prefersReducedMotion
        });
      }

      // Initialize particles background
      if (
        !prefersReducedMotion &&
        typeof particlesJS !== "undefined" &&
        document.getElementById("particles-js")
      ) {
        particlesJS("particles-js", {
          particles: {
            number: {
              value: 65,
              density: {
                enable: true,
                value_area: 900
              }
            },

            color: {
              value: "#ffffff"
            },

            shape: {
              type: "circle"
            },

            opacity: {
              value: 0.4,
              random: true
            },

            size: {
              value: 3,
              random: true
            },

            line_linked: {
              enable: true,
              distance: 150,
              color: "#ffffff",
              opacity: 0.2,
              width: 1
            },

            move: {
              enable: true,
              speed: 1.5,
              direction: "none",
              random: true,
              straight: false,
              out_mode: "out"
            }
          },

          interactivity: {
            detect_on: "canvas",

            events: {
              onhover: {
                enable: true,
                mode: "repulse"
              },

              onclick: {
                enable: true,
                mode: "push"
              },

              resize: true
            },

            modes: {
              repulse: {
                distance: 100,
                duration: 0.4
              },

              push: {
                particles_nb: 3
              }
            }
          },

          retina_detect: true
        });
      }

      // Typed introduction
      const introElement = document.getElementById("intro-text");

      const introductionMessages = [
        "Hi, I'm <strong>Aphelele Marwarwa</strong>",
        "Cybersecurity Enthusiast",
        "Software Developer",
        "Problem Solver",
        "Creative Thinker"
      ];

      if (
        introElement &&
        !prefersReducedMotion &&
        typeof Typed !== "undefined"
      ) {
        new Typed("#intro-text", {
          strings: introductionMessages,
          typeSpeed: 45,
          backSpeed: 25,
          backDelay: 1800,
          startDelay: 400,
          loop: true,
          showCursor: true,
          cursorChar: "|",
          smartBackspace: true,
          contentType: "html"
        });
      }

    });
  </script>

</body>
</html>
